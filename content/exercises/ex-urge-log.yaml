id: ex-urge-log
title: Urge log
duration_minutes: 5
instructions: |
  This week, log the urges rather than the cigarettes. When one arrives, note
  the time, what was happening, how strong it was out of ten, and how long it
  lasted before it faded.

  Where you use the technique we discussed, mark that entry with a tick. Where
  you meant to and did not, mark it with a dash. Both are useful; only the blank
  entries are not.
