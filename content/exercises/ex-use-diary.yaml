id: ex-use-diary
title: Use diary
duration_minutes: 5
instructions: |
  Between now and our next conversation, write down every time you use nicotine.
  Not afterwards, at the time. Three things only: what time it was, where you
  were, and how much you wanted it out of ten.

  Do not try to cut down while you are doing this. The diary is a measurement,
  and changing what you do while measuring it makes the measurement useless.
