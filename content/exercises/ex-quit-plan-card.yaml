id: ex-quit-plan-card
title: Plan card
duration_minutes: 10
attachment: quit-plan-card.pdf
instructions: |
  Write the plan onto one card, small enough to carry.

  On the front: your date, and the two reasons that matter most to you, in your
  own words.

  On the back: each situation we identified, and next to it the one thing you
  will do instead. Nothing else. A plan you have to read twice in a difficult
  moment is not a plan.

  Keep it where you used to keep the packet.
