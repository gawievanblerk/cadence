id: kb-withdrawal-timeline
title: What the first days feel like
audience: client
tags: [education, withdrawal, quit-day]
body: |
  Nicotine withdrawal follows a fairly predictable course, which is useful
  mainly because it lets you tell an ordinary bad afternoon from something going
  wrong.

  The first day is usually manageable and often better than expected. Days two
  and three are typically the hardest: irritability, difficulty concentrating,
  restlessness, disturbed sleep and a persistent low-grade wanting. Appetite
  frequently increases.

  By the end of the first week the physical symptoms are mostly receding. What
  remains after that is situational: particular places, particular people,
  particular times of day. Those are habit rather than withdrawal, and they fade
  on a longer timescale, over weeks rather than days.

  Coughing that begins or worsens after stopping is common and is usually the
  airways clearing. It is worth mentioning to a doctor if it persists beyond a
  few weeks.

  Sleep disturbance and low mood in the first fortnight are ordinary. Low mood
  that deepens, or that is still there after a month, is worth raising with a
  doctor rather than waiting out.
