id: kb-urge-surfing
title: Riding out an urge
audience: client
tags: [technique, craving, core]
body: |
  An urge to smoke behaves like a wave. It builds, it peaks, and it falls away
  on its own whether or not you act on it. Most urges peak within three to five
  minutes and are gone inside ten, though they feel much longer from the inside.

  The technique is to do nothing, on purpose, and pay attention while you do it.

  1. Notice the urge has started, and say so to yourself in plain words: this is
     an urge, it has just started.
  2. Find where you feel it. Most people report the throat, the chest, the hands
     or the jaw. Put your attention there rather than on the thought about
     smoking.
  3. Stay with it and let it rise. Do not fight it, argue with it, or distract
     yourself. You are not resisting; you are watching.
  4. Notice it change. It will not stay at its peak. Wait for the point where it
     starts to drop.
  5. Note how long it took. Most people are surprised.

  What makes this different from willpower is that you are not trying to hold
  anything back. You are waiting for something temporary to finish being
  temporary. It works better each time you do it, because the evidence that the
  wave breaks accumulates.

  The first two or three attempts often feel like the technique is not working.
  That is expected and is not a reason to abandon it.
