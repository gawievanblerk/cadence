id: kb-lapse-vs-relapse
title: A lapse is not a relapse
audience: client
tags: [recovery, lapse, core]
body: |
  A lapse is a single episode of use after a period without. A relapse is a
  return to the previous pattern. They are different events, and the distance
  between them is decided in the hours after the first one, not by the first one
  itself.

  Most people who successfully stop have lapsed at least once. The lapse is not
  the thing that predicts the outcome. What predicts the outcome is what the
  person concludes about themselves afterwards.

  The reasoning that turns one into the other runs like this: I have had one, so
  the attempt is ruined, so there is no difference between one and twenty, so I
  may as well. Every step of that is false, and the falseness is worth naming
  before the next lapse rather than after.

  What to do in the hours after a lapse:

  - Record it. An unrecorded lapse is one you cannot plan against.
  - Do not restart the count as though nothing before it happened. The days
    before the lapse were real and they are not cancelled.
  - Work out what the situation was, specifically, and what would have had to be
    available for the planned response to have been reachable.
  - Restate the commitment with a date on it, the same day if possible.
